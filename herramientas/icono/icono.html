<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Shr;src:url(shr.woff2) format('woff2')}
html,body{margin:0;background:transparent}
.ic{position:relative;width:512px;height:512px;overflow:hidden;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(60% 55% at 22% 18%,#FFD3DD 0%,rgba(255,211,221,0) 70%),radial-gradient(55% 50% at 85% 90%,#F3DCF0 0%,rgba(243,220,240,0) 70%),#FFF1F4}
.w{font-family:Shr;color:#FF1A5D;line-height:1;letter-spacing:-.01em;white-space:nowrap;transform:rotate(-4deg);
 text-shadow:3px 3px 0 #fff,10px 10px 0 #FFB3C6;display:flex;align-items:flex-end}
.dot{display:inline-block;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0%,#FFD1DC 18%,#FF6E96 55%,#FF1A5D 78%,#C2174F 100%);box-shadow:0 0 0 4px #fff}
</style></head><body><div class="ic" id="ic"><div class="w" id="w">Plena<span class="dot" id="d"></span></div></div>
<script>
const q=new URLSearchParams(location.search), fs=+q.get('fs')||150;
const w=document.getElementById('w'), d=document.getElementById('d');
w.style.fontSize=fs+'px'; d.style.width=d.style.height=(fs*0.2)+'px'; d.style.marginLeft=(fs*0.03)+'px'; d.style.marginBottom=(fs*0.17)+'px';
w.style.textShadow=`${fs*0.02}px ${fs*0.02}px 0 #fff, ${fs*0.065}px ${fs*0.065}px 0 #FFB3C6`;
if(q.get('round')) document.getElementById('ic').style.borderRadius='0';
document.fonts.ready.then(()=>document.body.dataset.ok=1);
</script></body></html>
