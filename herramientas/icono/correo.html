<!doctype html><html><head><meta charset="utf-8"><style>
/* Logotipo «Plena» para los correos: 400×160 px (se muestra a 200×80), fondo blanco para que se vea igual en todos los clientes. */
@font-face{font-family:Shr;src:url(shr.woff2) format('woff2')}
html,body{margin:0;background:#fff}
.c{width:400px;height:160px;display:flex;align-items:center;justify-content:center;background:#fff}
.w{font-family:Shr;color:#FF1A5D;font-size:104px;line-height:1;white-space:nowrap;transform:rotate(-4deg);text-shadow:2px 2px 0 #fff,7px 7px 0 #FFB3C6;display:flex;align-items:flex-end;margin-top:-8px}
.dot{display:inline-block;width:21px;height:21px;margin:0 0 18px 3px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0%,#FFD1DC 18%,#FF6E96 55%,#FF1A5D 78%,#C2174F 100%);box-shadow:0 0 0 3px #fff}
</style></head><body><div class="c"><div class="w">Plena<span class="dot"></span></div></div><script>document.fonts.ready.then(()=>document.body.dataset.ok=1)</script></body></html>
