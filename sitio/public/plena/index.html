<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PLENA · Academia de Menopausia y Psicomenopausia</title>
<meta name="description" content="Tu plataforma privada: curso de menopausia y psicomenopausia, libros, plantillas y tu app, en un solo lugar.">
<meta name="theme-color" content="#1E1419">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Great+Vibes&family=Poppins:wght@400;500;600;700;800&family=Silkscreen&display=swap">
<style>
:root{--bg:#FFF5F8;--blush:#FCE4EC;--rosa:#F7A8C7;--fucsia:#E0337A;--berry:#9B1B4F;--ink:#2B1B24;--negro:#1E1419;--muted:#6B4E5C;--line:#F2C6D6;--sun:#FFD95A;--cielo:#CFE3F7;--ok:#1F7A52;--sh:0 14px 40px rgba(155,27,79,.14);--sh2:0 6px 18px rgba(155,27,79,.12);--r:24px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,Arial,sans-serif;font-size:16.5px;line-height:1.6;overflow-x:hidden}
img{max-width:100%;height:auto}
a{color:var(--berry)}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.ser{font-family:'Playfair Display',Georgia,serif}
.scr{font-family:'Great Vibes',cursive;font-weight:400;color:var(--fucsia)}
.px{font-family:'Silkscreen',monospace;text-transform:uppercase;letter-spacing:.04em}
.kick{display:inline-block;background:var(--rosa);color:var(--negro);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.kick.dark{background:var(--negro);color:#FFD3E3}
.hl{background:linear-gradient(transparent 58%,#FFC2D9 58%)}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.btn{appearance:none;border:0;border-radius:999px;font-weight:800;padding:13px 22px;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,background .18s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--fucsia);color:#fff;box-shadow:0 10px 24px rgba(224,51,122,.35)}
.btn-p:hover{background:#C9246A}
.btn-d{background:var(--negro);color:#fff}
.btn-g{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn-s{min-height:42px;padding:9px 16px;font-size:14.5px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh2);border:1px solid #FBE3EC}
.stk{filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 14px 18px rgba(120,20,60,.22))}
.tape{position:absolute;width:90px;height:24px;background:rgba(207,227,247,.85);top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg)}
.lined{background-color:#FFFDFB;background-image:repeating-linear-gradient(transparent 0 31px,#E6EEF8 31px 32px)}
/* barra superior */
header.top{position:sticky;top:0;z-index:40;background:rgba(30,20,25,.96);backdrop-filter:blur(8px);color:#fff}
header.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}
.logo{display:flex;align-items:baseline;gap:8px;color:#fff;text-decoration:none}
.logo b{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;letter-spacing:.06em}
.logo i{font-family:'Great Vibes',cursive;font-style:normal;color:var(--rosa);font-size:21px;white-space:nowrap}
nav.main{display:flex;gap:4px}
nav.main a{color:#F2C9D7;text-decoration:none;font-weight:600;font-size:14.5px;padding:8px 14px;border-radius:999px}
nav.main a[aria-current]{background:var(--fucsia);color:#fff}
nav.bottom{display:none}
@media (max-width:820px){
  nav.main{display:none}
  .logo i{display:none}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -8px 24px rgba(155,27,79,.1)}
  nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 2px;border-radius:14px}
  nav.bottom a svg{width:24px;height:24px}
  nav.bottom a[aria-current]{color:var(--fucsia);background:var(--blush)}
  main{padding-bottom:86px}
}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:#FFD3E3;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none}
/* vistas */
main{min-height:70vh}
.view{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@keyframes flt{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
@keyframes flt2{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(8px) rotate(calc(var(--r,0deg) + 4deg))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.flt{animation:flt 5.5s ease-in-out infinite}
.flt2{animation:flt2 6.5s ease-in-out infinite}
.sk{position:absolute;pointer-events:none;z-index:3}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* hero inicio */
.hero{position:relative;background:var(--rosa);overflow:hidden;border-radius:0 0 40px 40px}
.hero .in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:end;min-height:430px;padding-top:34px}
.hero h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(40px,6.4vw,74px);line-height:.98;margin:12px 0 0;letter-spacing:-.01em}
.hero h1 .scr{display:block;font-size:.86em;line-height:1;margin:2px 0 0 .3em;color:var(--berry)}
.hero p.lede{font-size:18px;font-weight:500;max-width:520px;margin:16px 0 22px}
.hero .collage{position:relative;height:430px}
.hero .collage .c1{position:absolute;right:4%;bottom:-6px;height:410px;width:auto}
.hero .collage .c2{position:absolute;left:0;bottom:30px;height:200px;width:auto;--r:-6deg}
.hero .lines{position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 33px,rgba(255,255,255,.35) 33px 34px);pointer-events:none}
@media (max-width:820px){.hero .in{grid-template-columns:1fr;min-height:0;padding-bottom:0}.hero .collage{height:300px;margin-top:-10px}.hero .collage .c1{height:300px;right:0}.hero .collage .c2{height:140px}}
.ring{width:92px;height:92px;flex:0 0 92px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.6)}
.ring .fg{stroke:var(--fucsia);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.stat{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.7);border-radius:22px;padding:12px 16px;max-width:430px}
.stat b{font-family:'Playfair Display',serif;font-size:28px;display:block;line-height:1}
/* secciones */
.sec{padding:40px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-h h2{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:8px 0 0}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.continue{position:relative;display:grid;grid-template-columns:150px 1fr;gap:18px;padding:20px;overflow:hidden;align-items:center;text-decoration:none;color:inherit}
.continue img.ph{width:150px;height:150px;object-fit:cover;border-radius:18px}
.continue h3{font-family:'Playfair Display',serif;font-size:24px;margin:6px 0 4px;line-height:1.15}
@media (max-width:520px){.continue{grid-template-columns:1fr}.continue img.ph{width:100%;height:170px}}
.today{background:var(--negro);color:#fff;padding:22px;position:relative;overflow:hidden}
.today h3{font-family:'Playfair Display',serif;font-size:24px;margin:8px 0 6px;line-height:1.2}
.today p{color:#F2C9D7;margin:0 0 14px}
.today .sk{right:-10px;bottom:-12px;width:84px;opacity:.9}
/* ruta */
.route{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.mod{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:26px;overflow:hidden;background:#fff;box-shadow:var(--sh2);border:1px solid #FBE3EC;transition:transform .25s ease,box-shadow .25s ease}
.mod:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:var(--sh)}
.mod .ph{position:relative;height:150px;overflow:hidden}
.mod .ph img.f{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.mod:hover .ph img.f{transform:scale(1.06)}
.mod .ph .n{position:absolute;left:14px;top:12px;background:var(--negro);color:#FFD3E3;font-family:'Silkscreen',monospace;font-size:12px;padding:5px 10px;border-radius:999px}
.mod .ph .for{position:absolute;right:12px;top:12px;background:var(--fucsia);color:#fff;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;box-shadow:0 6px 14px rgba(224,51,122,.4)}
.mod .cut{position:absolute;right:4px;top:56px;height:124px;width:auto;z-index:2}
.mod .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.mod h3{font-family:'Playfair Display',serif;font-size:22px;line-height:1.15;margin:0;padding-right:84px}
.mod .sub{font-size:14px;color:var(--muted);margin:0;padding-right:60px}
.bar{height:8px;background:var(--blush);border-radius:99px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--fucsia),#FF7AB0);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.meta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.done-badge{position:absolute;left:14px;bottom:12px;background:var(--ok);color:#fff;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;z-index:3}
/* módulo */
.mhero{position:relative;overflow:hidden;border-radius:0 0 40px 40px;color:var(--ink)}
.mhero .in{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:end;min-height:380px;padding-top:28px;position:relative}
.mhero h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(36px,5.6vw,62px);line-height:1;margin:12px 0 8px}
.mhero .quote{position:relative;background:#fff;border-radius:20px;padding:16px 18px 14px;box-shadow:var(--sh2);max-width:520px;margin:16px 0 26px;transform:rotate(-1deg)}
.mhero .quote q{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;line-height:1.4;display:block}
.mhero .quote p{margin:8px 0 0;font-weight:600;color:var(--berry);font-size:15px}
.mhero .vis{position:relative;height:380px}
.mhero .vis .f{position:absolute;right:30px;top:30px;width:250px;height:190px;object-fit:cover;border:8px solid #fff;box-shadow:var(--sh);transform:rotate(4deg)}
.mhero .vis .c{position:absolute;right:-4px;bottom:-6px;height:300px;width:auto;z-index:2}
@media (max-width:820px){.mhero .in{grid-template-columns:1fr;min-height:0}.mhero .vis{height:260px}.mhero .vis .f{width:190px;height:140px;left:6px;right:auto;top:20px}.mhero .vis .c{height:250px}}
.lessons{display:flex;flex-direction:column;gap:12px}
.les{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 18px;text-decoration:none;color:inherit;transition:transform .2s ease,box-shadow .2s ease}
.les:hover{transform:translateX(4px);box-shadow:var(--sh)}
.les .ck{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Playfair Display',serif;font-size:19px;background:var(--blush);color:var(--berry)}
.les.ok .ck{background:var(--ok);color:#fff}
.les b{display:block;font-size:16.5px;line-height:1.3}
.les span.m{font-size:13px;color:var(--muted);font-weight:600}
.les .go{font-weight:800;color:var(--fucsia);font-size:22px}
/* lección */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;font-weight:600;color:var(--muted);margin:22px 0 4px}
.crumbs a{color:var(--berry);text-decoration:none}
.lesson h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(30px,4.6vw,48px);line-height:1.05;margin:8px 0 14px}
.lgrid{display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:start}
@media (max-width:900px){.lgrid{grid-template-columns:1fr}}
.video{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:var(--negro);box-shadow:var(--sh)}
.video iframe,.video img.thumb{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.video button.play{position:absolute;inset:0;width:100%;border:0;background:linear-gradient(180deg,rgba(30,20,25,.05),rgba(30,20,25,.45));display:flex;align-items:center;justify-content:center}
.video .pbtn{width:84px;height:84px;border-radius:50%;background:var(--fucsia);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(224,51,122,.25);transition:transform .2s}
.video button.play:hover .pbtn{transform:scale(1.08)}
.video.soon{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;text-align:center;padding:20px;background:radial-gradient(circle at 30% 30%,#4a2a3a,#1E1419)}
.video.soon .pbtn{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,51,122,.5)}50%{box-shadow:0 0 0 18px rgba(224,51,122,0)}}
.video.soon .sk{height:150px;width:auto;right:10px;bottom:-6px;opacity:.95}
@media (max-width:560px){.video.soon .sk{display:none}}
.txt p{font-size:17px;margin:0 0 14px}
.keys{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.keys li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-weight:600}
.keys li i{width:28px;height:28px;border-radius:50%;background:var(--fucsia);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:14px}
.mito{display:grid;grid-template-columns:1fr 1fr;border-radius:22px;overflow:hidden;box-shadow:var(--sh2)}
.mito div{padding:18px}
.mito .m{background:var(--negro);color:#fff}
.mito .v{background:#E3F4EC}
.mito .px{font-size:12px}
@media (max-width:560px){.mito{grid-template-columns:1fr}}
.task{position:relative;background:var(--sun);border-radius:22px;padding:18px 20px;overflow:hidden}
.task h3{font-family:'Playfair Display',serif;margin:6px 0;font-size:21px;line-height:1.25}
.res{display:flex;flex-direction:column;gap:10px}
.res a{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#fff;border:2px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px;line-height:1.3;transition:border-color .2s,transform .2s}
.res a:hover{border-color:var(--fucsia);transform:translateY(-2px)}
.res a img{width:44px;height:60px;object-fit:cover;border-radius:6px;box-shadow:var(--sh2)}
.res a .ic{width:44px;height:44px;border-radius:12px;background:var(--blush);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:16px}
.complete{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:18px 20px}
/* biblioteca */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px}
@media (max-width:560px){.lib{grid-template-columns:1fr 1fr;gap:16px}}
.book{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.book .cv{position:relative;aspect-ratio:560/792;border-radius:10px;overflow:hidden;box-shadow:0 14px 30px rgba(43,27,36,.22);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.book:hover .cv{transform:translateY(-8px) rotate(-1.5deg)}
.book .cv img{width:100%;height:100%;object-fit:cover}
.book b{font-size:15px;line-height:1.3}
.book span{font-size:13px;color:var(--muted)}
.book .dl{font-size:13px;font-weight:800;color:var(--fucsia)}
/* onboarding / lock */
.ov{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:30px 16px;position:relative;overflow:hidden;background:var(--rosa)}
.ov .box{position:relative;z-index:2;width:100%;max-width:560px;background:#fff;border-radius:30px;padding:30px 26px;box-shadow:var(--sh)}
.ov h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(32px,5vw,46px);line-height:1.02;margin:10px 0 8px}
.ov .bg1{position:absolute;left:-30px;bottom:-10px;height:340px;width:auto;opacity:.95}
.ov .bg2{position:absolute;right:-20px;top:30px;height:300px;width:auto}
@media (max-width:820px){.ov .bg1,.ov .bg2{display:none}}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--blush)}
.steps i.on{background:var(--fucsia)}
.fld{display:grid;gap:6px;font-weight:600;font-size:15px;margin:10px 0}
.fld input{width:100%;font:inherit;font-size:17px;min-height:54px;border-radius:16px;border:2px solid var(--line);padding:0 16px}
.fld input:focus{outline:none;border-color:var(--fucsia);box-shadow:0 0 0 4px rgba(224,51,122,.15)}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:13px 15px;cursor:pointer;font-weight:600;transition:border-color .2s,background .2s,transform .15s;background:#fff}
.opt:hover{transform:translateY(-2px)}
.opt input{width:22px;height:22px;accent-color:var(--fucsia);flex:0 0 22px}
.opt:has(input:checked){border-color:var(--fucsia);background:var(--blush)}
.err{color:#B3261E;font-weight:700;font-size:14.5px;margin:6px 0 0}
.magic{text-align:center}
.magic .orb{width:110px;height:110px;margin:10px auto 16px;border-radius:50%;background:conic-gradient(var(--fucsia),var(--rosa),var(--sun),var(--fucsia));animation:spin 1.6s linear infinite;display:flex;align-items:center;justify-content:center}
.magic .orb i{width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:34px}
/* perfil / certificado */
.cert{position:relative;background:#fff;border:10px solid var(--rosa);outline:2px solid var(--fucsia);outline-offset:-18px;border-radius:8px;padding:48px 30px;text-align:center;overflow:hidden}
.cert h2{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(30px,5vw,48px);margin:6px 0}
.cert .name{font-family:'Great Vibes',cursive;font-size:clamp(46px,8vw,78px);color:var(--fucsia);line-height:1.1;margin:10px 0}
footer.f{padding:30px 0 40px;color:var(--muted);font-size:13.5px;text-align:center}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;z-index:80;box-shadow:var(--sh);animation:pop .35s ease}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;animation:fall 2.6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media print{header.top,nav.bottom,footer.f,.noprint{display:none!important}body{background:#fff}.cert{margin:0;border-width:14px}}
</style>
</head>
<body>
<header class="top"><div class="wrap in">
  <a class="logo" href="#inicio"><b>PLENA</b><i>menopausia y psicomenopausia</i></a>
  <nav class="main" aria-label="Secciones">
