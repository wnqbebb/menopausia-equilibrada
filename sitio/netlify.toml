[build]
  publish = "public"
  command = "npm install --no-audit --no-fund && mkdir -p public/_src && cp public/index.html public/_src/index.html && cp public/oferta/index.html public/_src/oferta.html && cp public/oferta/gracias.html public/_src/gracias.html && cp public/oferta/admin.html public/_src/admin.html"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/entrega-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, max-age=3600"

[[headers]]
  for = "/oferta/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/oferta/gracias.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/oferta/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/oferta/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/comprar"
  to = "/oferta/"
  status = 301

[[redirects]]
  from = "/pack"
  to = "/oferta/"
  status = 301

[[headers]]
  for = "/_src/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
